# Builds an app of the catalog from the private source and publishes it in the releases of
# this repository. Only by hand (workflow_dispatch): no pull request can start it, and it
# keeps no cache, so nothing of the source stays in this public repository. The source is
# read with a read-only deploy key (SRC_DEPLOY_KEY). The Mac app is signed with the
# Developer ID and notarized with the secrets of the organization. Windows (x64, ARM64) and
# Linux (x64, ARM64) are built too; the Windows installers are not signed yet.

name: Release

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to publish
        required: true
        type: choice
        options:
          - totalcode
          - totalfetch
          - lesscode
      ref:
        description: Commit, branch or tag of totaljs-desktop-src
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.app }}
  cancel-in-progress: false

env:
  CARGO_TERM_QUIET: true
  CARGO_TERM_COLOR: never

jobs:
  mac:
    name: ${{ inputs.app }} for Mac
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
      title: ${{ steps.meta.outputs.title }}
    steps:
      - name: The secrets are there
        env:
          SRC_DEPLOY_KEY: ${{ secrets.SRC_DEPLOY_KEY }}
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          missing=""
          [ -n "$SRC_DEPLOY_KEY" ] || missing="$missing SRC_DEPLOY_KEY"
          [ -n "$MAC_CERTIFICATE" ] || missing="$missing MAC_CERTIFICATE"
          [ -n "$APPLE_ID" ] || missing="$missing APPLE_ID"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: totaljs-es/totaljs-desktop-src
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          persist-credentials: false
          path: src

      - name: Name and version
        id: meta
        working-directory: src/apps/${{ inputs.app }}
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "title=$(node -p "require('./src-tauri/tauri.conf.json').productName")" >> "$GITHUB_OUTPUT"

      - name: Notes from the changelog of the app
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          awk -v head="## $VERSION" '$0 == head { take = 1; next } /^## / { take = 0 } take' "src/apps/$APP/CHANGELOG.md" > "$RUNNER_TEMP/out/changes.md"
          if [ ! -s "$RUNNER_TEMP/out/changes.md" ]; then echo "::error::apps/$APP/CHANGELOG.md has no section ## $VERSION"; exit 1; fi

      - name: Rust for both Mac processors
        working-directory: src
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Packages
        working-directory: src
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Build, sign and notarize
        working-directory: src
        env:
          APPLE_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Gera G. Guiles (PA3YPNH922)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -w @totaldesktop/${{ inputs.app }} -- build --target universal-apple-darwin --bundles app,dmg

      - name: Notarize the disk image and check both
        working-directory: src
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TITLE: ${{ steps.meta.outputs.title }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          APP="$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app | head -1)"
          DMG="$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type execute --verbose=2 "$APP"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$DMG" "$RUNNER_TEMP/out/${TITLE}-${VERSION}-mac.dmg"
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac
          path: ${{ runner.temp }}/out/
          retention-days: 3

  windows:
    name: ${{ inputs.app }} for Windows ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - arch: arm64
            target: aarch64-pc-windows-msvc
            bundles: nsis
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: totaljs-es/totaljs-desktop-src
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          persist-credentials: false
          path: src

      - name: Rust for ${{ matrix.target }}
        working-directory: src
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Packages
        working-directory: src
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Build
        working-directory: src
        run: npm run tauri -w @totaldesktop/${{ inputs.app }} -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Name the installers
        working-directory: src
        run: |
          meta() { node -p "require('./apps/${{ inputs.app }}/$1').$2"; }
          name="$(meta src-tauri/tauri.conf.json productName)-$(meta package.json version)-windows-${{ matrix.arch }}"
          bundle=target/${{ matrix.target }}/release/bundle
          mkdir -p "$RUNNER_TEMP/out"
          cp "$bundle"/nsis/*.exe "$RUNNER_TEMP/out/$name-setup.exe"
          if ls "$bundle"/msi/*.msi >/dev/null 2>&1; then cp "$bundle"/msi/*.msi "$RUNNER_TEMP/out/$name.msi"; fi
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/
          retention-days: 3

  linux:
    name: ${{ inputs.app }} for Linux ${{ matrix.deb }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            deb: amd64
            rpm: x86_64
          - runner: ubuntu-22.04-arm
            deb: arm64
            rpm: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: totaljs-es/totaljs-desktop-src
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          persist-credentials: false
          path: src

      - name: Libraries of the web view
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf rpm

      - name: Rust
        working-directory: src
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Packages
        working-directory: src
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Build
        working-directory: src
        run: npm run tauri -w @totaldesktop/${{ inputs.app }} -- build --bundles deb,rpm,appimage

      - name: Name the packages
        working-directory: src
        run: |
          meta() { node -p "require('./apps/${{ inputs.app }}/$1').$2"; }
          name="$(meta src-tauri/tauri.conf.json productName)-$(meta package.json version)-linux"
          bundle=target/release/bundle
          mkdir -p "$RUNNER_TEMP/out"
          cp "$bundle"/deb/*.deb "$RUNNER_TEMP/out/$name-${{ matrix.deb }}.deb"
          cp "$bundle"/rpm/*.rpm "$RUNNER_TEMP/out/$name-${{ matrix.rpm }}.rpm"
          cp "$bundle"/appimage/*.AppImage "$RUNNER_TEMP/out/$name-${{ matrix.rpm }}.AppImage"
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.deb }}
          path: ${{ runner.temp }}/out/
          retention-days: 3

  publish:
    name: Publish the release
    needs: [mac, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true

      - name: SHA-256 of every file
        run: |
          mv out/changes.md changes.md
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Release ${{ inputs.app }}-v${{ needs.mac.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
          VERSION: ${{ needs.mac.outputs.version }}
          TAG: ${{ inputs.app }}-v${{ needs.mac.outputs.version }}
          TITLE: ${{ needs.mac.outputs.title }} ${{ needs.mac.outputs.version }}
        run: |
          {
            echo "## What is new"
            echo
            cat changes.md
            echo
            echo "## Install"
            echo
            echo "- **macOS** (Apple silicon and Intel): open the \`.dmg\` and drag the app to Applications. Signed and notarized by Apple."
            echo "- **Windows**: run the \`-setup.exe\` (or the \`.msi\` on x64). The installer is not signed yet: the first time, SmartScreen says it protected your PC; choose **More info → Run anyway**."
            echo "- **Linux**: the \`.deb\` for Debian and Ubuntu, the \`.rpm\` for Fedora and openSUSE, or the \`.AppImage\` for any distribution."
            echo
            echo "The SHA-256 of each file is in SHA256SUMS.txt."
          } > notes.md
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* --title "$TITLE" --notes-file notes.md -R "$GITHUB_REPOSITORY"
          fi

      # The same files without the version in their names, in a release that never changes
      # its address: the download links of the pages always give the last version.
      - name: Latest of ${{ inputs.app }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
          VERSION: ${{ needs.mac.outputs.version }}
          NAME: ${{ needs.mac.outputs.title }}
        run: |
          mkdir latest
          for file in out/*.dmg out/*.exe out/*.msi out/*.deb out/*.rpm out/*.AppImage; do
            [ -e "$file" ] || continue
            name="$(basename "$file")"
            cp "$file" "latest/${name/-$VERSION/}"
          done
          (cd latest && sha256sum * > SHA256SUMS.txt)
          {
            echo "The last version of **$NAME**: **$VERSION**. These addresses never change, so links to them always give the last version."
            echo
            echo "Every version, with its notes: [releases of $NAME](https://github.com/$GITHUB_REPOSITORY/releases?q=$APP-v)."
            echo
            sed -n '/^## Install/,$p' notes.md
          } > latest.md
          LATEST="$APP-latest"
          if gh release view "$LATEST" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$LATEST" latest/* --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$LATEST" --title "$NAME (latest: $VERSION)" --notes-file latest.md -R "$GITHUB_REPOSITORY"
          else
            gh release create "$LATEST" latest/* --title "$NAME (latest: $VERSION)" --notes-file latest.md --latest=false -R "$GITHUB_REPOSITORY"
          fi
